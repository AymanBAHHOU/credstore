[package]
name = "credstore"
description = "credstore CLI and MCP shim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "credstore"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
credstore-core.workspace = true
credstore-os.workspace = true
credstore-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
credstored.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
