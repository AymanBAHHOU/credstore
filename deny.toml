[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore needs a reason. Revisit when age publishes a release without them.
ignore = [
    # basic-toml: unmaintained. Build-time only, via age -> i18n-embed-fl/i18n-config,
    # which read age's localization config while compiling. Never handles secrets.
    # age 0.12 drops it but adds crypto-bigint with RUSTSEC-2026-0387 (timing), so we
    # stay on 0.11.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via age 0.11 i18n macros" },
    # proc-macro-error2: unmaintained proc-macro helper, via age -> i18n-embed-fl.
    # Runs only inside the compiler.
    { id = "RUSTSEC-2026-0173", reason = "compile-time proc-macro via age 0.11 i18n" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# The Mozilla CA list that ureq's rustls uses for http_request (M11) is data under a
# permissive data license; allowed for that crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
