# credstore accounts (spec 8). Installed to /etc/sysusers.d/credstore.conf.
#
# credstore            the daemon's own user and group (home: its state directory)
# credstore-agents     may connect to /run/credstore/agent.sock (list_secrets, run)
# credstore-approvers  may connect to /run/credstore/approver.sock (every request there
#                      still needs the vault passphrase)
#
# The daemon user is a member of both groups so it can hand its sockets to them.
g credstore-agents    -
g credstore-approvers -
u credstore           - "credstore daemon" /var/lib/credstore /usr/sbin/nologin
m credstore credstore-agents
m credstore credstore-approvers
