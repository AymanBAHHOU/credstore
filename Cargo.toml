[workspace]
resolver = "2"
exclude = ["app"]
members = [
    "crates/credstore-proto",
    "crates/credstore-core",
    "crates/credstore-os",
    "crates/credstored",
    "crates/credstore",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
credstore-proto = { path = "crates/credstore-proto" }
credstore-core = { path = "crates/credstore-core" }
credstore-os = { path = "crates/credstore-os" }
credstored = { path = "crates/credstored" }
credstore = { path = "crates/credstore" }

age = "0.11"
anyhow = "1"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
globset = "0.4"
landlock = "0.4"
# MCP server (stdio). Default features off: no HTTP transports, no auth.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
nix = { version = "0.31", features = ["fs", "process", "resource", "signal", "user"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
toml = "1"
# Policy edits from the app that keep the file's comments; shares toml's parser crates.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# HTTPS client for http_request (M11): rustls with the Mozilla roots, no gzip, no cookies.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Windows Hello (M13): the WinRT KeyCredentialManager, which windows-sys does not cover.
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

# scrypt is very slow unoptimized; the vault's scrypt cost is fixed (not timing-based),
# so this only affects speed. Optimize the KDF crates in debug and test builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
