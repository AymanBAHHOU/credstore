name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Linux: bubblewrap is the preferred sandbox. Ubuntu 24.04 blocks unprivileged
      # user namespaces through AppArmor by default; allow them so bwrap works.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bwrap works"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The daemon starts commands through credstore-sandbox.exe on Windows (M12); the
      # tests find it next to their own binaries.
      - run: cargo build -p credstored --bins
      - run: cargo test --workspace
      - name: AppContainer NUL probe (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p credstore-tests --test m12_appcontainer nul_device_probe -- --nocapture
      # Windows: again with the Job Object alone (a machine where the AppContainer
      # cannot be used).
      - name: Adversarial suite with the Job Object only (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p credstore-tests --test m5_adversarial --test m12_appcontainer
        env:
          CREDSTORE_FORCE_SANDBOX: job-object
      # Again with the Landlock fallback (what a machine without bubblewrap gets).
      - name: Adversarial suite with Landlock only (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p credstore-tests --test m5_adversarial
        env:
          CREDSTORE_FORCE_SANDBOX: landlock
      # And with no sandbox at all: gaps must be reported, and process-tree kill,
      # caps, redaction and cleanup must still hold.
      - name: Adversarial suite without a sandbox
        run: cargo test -p credstore-tests --test m5_adversarial
        env:
          CREDSTORE_FORCE_SANDBOX: none
      # M11: a real HTTPS request through http_request (public echo service), once more
      # after a pause if the service hiccups.
      - name: http_request against a live HTTPS service
        shell: bash
        run: |
          cargo test -p credstore-tests --test m11_http -- --ignored \
            || { sleep 20; cargo test -p credstore-tests --test m11_http -- --ignored; }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # M7: install the real service with the real installer, then drive it as a member of
  # the credstore groups (tests/m7_installed.rs).
  installed:
    name: installed-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installed
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build
        shell: bash
        run: |
          cargo build --release -p credstore -p credstored
          cargo build -p credstore-tests --bin credstore-adversary
          cargo test -p credstore-tests --test m7_installed --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "m7_installed") | .executable' \
            > smoke-test-path.txt
          cat smoke-test-path.txt

      - name: Install and smoke test (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          sudo bash ./deploy/install.sh --user "$USER"
          # M9: this shell's session predates the new groups; the users file lets it in.
          credstore list
          # M9: a project folder in the home directory, opened up with `credstore grant`
          # (no sudo), is where the approved commands run.
          export CREDSTORE_SMOKE_DIR="$HOME/credstore-smoke"
          mkdir -p "$CREDSTORE_SMOKE_DIR"
          cp target/debug/credstore-adversary "$CREDSTORE_SMOKE_DIR/"
          credstore grant --yes "$CREDSTORE_SMOKE_DIR"
          "$(cat smoke-test-path.txt)" --ignored --nocapture
      - name: Service log (Linux, macOS)
        if: failure() && runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo journalctl -u credstored.service --no-pager -n 200; else sudo cat /var/log/credstore/credstored.log; fi
      - name: Uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          sudo bash ./deploy/install.sh --uninstall
          ! test -e /usr/local/bin/credstored

      - name: Install and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Group membership reaches a token only at logon, so the test runs as a fresh
          # local user (random password, this runner only) added by the installer.
          $pw = ConvertTo-SecureString ("Cs1!" + [guid]::NewGuid().ToString('N')) -AsPlainText -Force
          New-LocalUser -Name cssmoke -Password $pw -PasswordNeverExpires | Out-Null
          .\deploy\install.ps1 -User "$env:COMPUTERNAME\cssmoke"
          $smoke = 'C:\credstore-smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item target\debug\credstore-adversary.exe, (Get-Content smoke-test-path.txt) $smoke
          icacls $smoke /grant 'cssmoke:(OI)(CI)M' | Out-Null
          # M9: the folder's owner opens it up for the service, without icacls by hand.
          & "$env:ProgramFiles\credstore\credstore.exe" grant --yes $smoke
          if ($LASTEXITCODE -ne 0) { throw 'credstore grant failed' }
          $test = Join-Path $smoke (Split-Path -Leaf (Get-Content smoke-test-path.txt))
          Start-Service seclogon -ErrorAction SilentlyContinue
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\cssmoke", $pw)
          $p = Start-Process -FilePath $test -ArgumentList '--ignored', '--nocapture' `
            -Credential $cred -LoadUserProfile -WorkingDirectory $smoke -Wait -PassThru `
            -RedirectStandardOutput "$smoke\out.txt" -RedirectStandardError "$smoke\err.txt"
          Get-Content "$smoke\out.txt", "$smoke\err.txt"
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }
      - name: No new logon needed (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # M9: add the runner's own account, whose logon predates the groups. The
          # users file gives it a pipe ACE of its own, so it connects at once.
          .\deploy\install.ps1 -User "$env:USERDOMAIN\$env:USERNAME"
          & "$env:ProgramFiles\credstore\credstore.exe" list
          if ($LASTEXITCODE -ne 0) { throw 'credstore list failed for a user added after logon' }
      - name: Service log (Windows)
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Service credstore -ErrorAction SilentlyContinue | Format-List *
          Get-Content "$env:ProgramData\credstore\credstored.log" -ErrorAction SilentlyContinue
      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\deploy\install.ps1 -Uninstall
          if (Get-Service credstore -ErrorAction SilentlyContinue) { throw 'service still there' }

  # M8: build the real packages, install them like a user would (apt, installer, msiexec),
  # run the M7 smoke test against the packaged service, then remove the package.
  packages:
    name: package-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages
          workspaces: |
            . -> target
            app -> app/target
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
      - name: Build binaries and the smoke test
        shell: bash
        run: |
          cargo build --release -p credstore -p credstored
          cargo build -p credstore-tests --bin credstore-adversary
          cargo test -p credstore-tests --test m7_installed --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "m7_installed") | .executable' \
            > smoke-test-path.txt
      # M10: the desktop app goes into the packages too.
      - name: Webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Build the desktop app
        shell: bash
        run: |
          cargo fmt --check --manifest-path app/Cargo.toml
          cargo build --release --manifest-path app/Cargo.toml

      - name: Build .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash packaging/build-linux.sh
      - name: Install the .deb and smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get install -y ./dist/credstore_*.deb
          systemctl is-active credstored.service
          test "$(command -v credstore)" = /usr/bin/credstore
          id -nG "$USER" | grep -qw credstore-agents
          sudo install -d -m 0755 /opt/credstore-smoke
          sudo install -m 0755 target/debug/credstore-adversary /opt/credstore-smoke/
          sudo -u "$USER" env CREDSTORE_SMOKE_DIR=/opt/credstore-smoke "$(cat smoke-test-path.txt)" --ignored --nocapture
          sudo -u "$USER" credstore doctor </dev/null
      - name: Install the app .deb and smoke test it (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/credstore-app_*.deb
          test -f /usr/share/applications/credstore-app.desktop
          sudo -u "$USER" env CREDSTORE_APP_SMOKE=1 xvfb-run -a credstore-app 2>&1 | tee app.txt
          grep -q 'page ready: installed reachable=true' app.txt
      - name: Remove the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove -y credstore-app credstore
          ! systemctl is-active credstored.service
          ! test -e /usr/bin/credstored
          sudo test -d /var/lib/credstore   # the vault is kept
      - name: Check the .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          rpm -qpl dist/credstore-[0-9]*.rpm | tee rpm-files.txt
          grep -qx /usr/bin/credstored rpm-files.txt
          rpm -qp --scripts dist/credstore-[0-9]*.rpm | grep -q 'install.sh --package'
          rpm -qpl dist/credstore-app-*.rpm | grep -qx /usr/bin/credstore-app

      - name: Build and install the .pkg, smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/build-pkg.sh
          sudo installer -pkg dist/credstore-*.pkg -target /
          test -x /usr/local/bin/credstored
          sudo launchctl print system/dev.credstore.daemon >/dev/null
          # The console user may not be the runner user; make sure it is in the groups.
          sudo /usr/local/share/credstore/install.sh --package --bin /usr/local/bin --user "$USER"
          sudo install -d -m 0755 /usr/local/credstore-smoke
          sudo install -m 0755 target/debug/credstore-adversary /usr/local/credstore-smoke/
          sudo -u "$USER" env CREDSTORE_SMOKE_DIR=/usr/local/credstore-smoke "$(cat smoke-test-path.txt)" --ignored --nocapture
          sudo -u "$USER" credstore doctor </dev/null
          CREDSTORE_APP_SMOKE=1 /Applications/credstore.app/Contents/MacOS/credstore-app 2>&1 | tee app.txt
          grep -q 'page ready: installed reachable=true' app.txt
          sudo /usr/local/share/credstore/install.sh --uninstall
          ! test -e /usr/local/bin/credstored
          ! test -e /Applications/credstore.app

      - name: Build the .msi (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\packaging\build-msi.ps1
      - name: Check the .msi has its pages (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $msi = (Get-ChildItem dist\credstore-*.msi).FullName
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi, 0))
          function Rows($sql) {
            $v = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            $v.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $v, $null) | Out-Null
            $out = @()
            while ($r = $v.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $v, $null)) {
              $out += $r.GetType().InvokeMember('StringData', 'GetProperty', $null, $r, 1)
            }
            $out
          }
          $dialogs = Rows 'SELECT `Dialog` FROM `Dialog`'
          foreach ($d in 'WelcomeDlg', 'VerifyReadyDlg', 'ProgressDlg', 'ExitDialog', 'MaintenanceTypeDlg') {
            if ($dialogs -notcontains $d) { throw "the .msi has no $d (found: $dialogs)" }
          }
          $actions = Rows 'SELECT `Action` FROM `CustomAction`'
          if ($actions -notcontains 'CsLaunchApp') { throw "the .msi has no CsLaunchApp (found: $actions)" }
          Write-Host "pages: $($dialogs -join ', ')"
      - name: Install the .msi and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pw = ConvertTo-SecureString ("Cs1!" + [guid]::NewGuid().ToString('N')) -AsPlainText -Force
          New-LocalUser -Name cssmoke -Password $pw -PasswordNeverExpires | Out-Null
          $msi = (Get-ChildItem dist\credstore-*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi-install.log', "CREDSTOREUSER=$env:COMPUTERNAME\cssmoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 80; throw "msiexec /i failed ($($p.ExitCode))" }
          if ((Get-Service credstore).Status -ne 'Running') { throw 'service not running' }
          if (-not (Test-Path "$env:ProgramFiles\credstore\credstore.exe")) { throw 'binaries missing' }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
          if (-not ($machinePath | Where-Object { $_.TrimEnd('\') -eq "$env:ProgramFiles\credstore" })) { throw 'PATH entry missing' }
          $smoke = 'C:\credstore-smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item target\debug\credstore-adversary.exe, (Get-Content smoke-test-path.txt) $smoke
          icacls $smoke /grant 'NT SERVICE\credstore:(OI)(CI)RX' /grant 'cssmoke:(OI)(CI)M' | Out-Null
          $test = Join-Path $smoke (Split-Path -Leaf (Get-Content smoke-test-path.txt))
          Start-Service seclogon -ErrorAction SilentlyContinue
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\cssmoke", $pw)
          $p = Start-Process -FilePath $test -ArgumentList '--ignored', '--nocapture' `
            -Credential $cred -LoadUserProfile -WorkingDirectory $smoke -Wait -PassThru `
            -RedirectStandardOutput "$smoke\out.txt" -RedirectStandardError "$smoke\err.txt"
          Get-Content "$smoke\out.txt", "$smoke\err.txt"
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }
      - name: Smoke test the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\credstore.lnk")) { throw 'app shortcut missing' }
          # The runner account is not in the credstore groups (cssmoke is), so the page
          # loads and reports the service as unreachable; the load is what is checked.
          $env:CREDSTORE_APP_SMOKE = '1'
          $p = Start-Process "$env:ProgramFiles\credstore\credstore-app.exe" -Wait -PassThru `
            -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Get-Content app-out.txt, app-err.txt
          if ($p.ExitCode -ne 0) { throw "app smoke failed ($($p.ExitCode))" }
          if (-not (Select-String -Path app-out.txt -Pattern 'page ready: installed' -Quiet)) { throw 'page did not load' }
      - name: MSI and service logs (Windows)
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content msi-install.log -ErrorAction SilentlyContinue | Select-String -Pattern 'WixQuietExec|install.ps1|==>|error|Return value 3' -Context 0,2
          Get-Content "$env:ProgramData\credstore\credstored.log" -ErrorAction SilentlyContinue
      - name: Remove the .msi (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $msi = (Get-ChildItem dist\credstore-*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'msi-remove.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-remove.log -Tail 80; throw "msiexec /x failed ($($p.ExitCode))" }
          if (Get-Service credstore -ErrorAction SilentlyContinue) { throw 'service still there' }
          if (Test-Path "$env:ProgramFiles\credstore\credstored.exe") { throw 'binaries still there' }
          if (Test-Path "$env:ProgramFiles\credstore\credstore-sandbox.exe") { throw 'launcher still there' }
          if (Test-Path "$env:ProgramFiles\credstore\credstore-app.exe") { throw 'app still there' }
          if (-not (Test-Path "$env:ProgramData\credstore")) { throw 'the vault directory was removed' }

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # A tag vX.Y.Z publishes the packages as a draft release; a human reviews and
  # publishes it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, installed, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "credstore $GITHUB_REF_NAME" --generate-notes
