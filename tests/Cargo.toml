[package]
name = "credstore-tests"
description = "credstore integration and adversarial tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[test]]
name = "m2_daemon"
path = "m2_daemon.rs"

[[test]]
name = "m3_policy"
path = "m3_policy.rs"

[[test]]
name = "m4_approvals"
path = "m4_approvals.rs"

[[test]]
name = "m5_adversarial"
path = "m5_adversarial.rs"

[[test]]
name = "m7_installed"
path = "m7_installed.rs"

[[test]]
name = "m11_http"
path = "m11_http.rs"

# A hostile command for the adversarial suite.
[[bin]]
name = "credstore-adversary"
path = "adversary.rs"

[dependencies]
anyhow.workspace = true
credstore.workspace = true
credstore-os.workspace = true
credstore-proto.workspace = true
credstored.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[test]]
name = "m12_appcontainer"
path = "m12_appcontainer.rs"

[[test]]
name = "m13_approval_keys"
path = "m13_approval_keys.rs"

[[test]]
name = "app_feed"
path = "app_feed.rs"
